<aside data-component="sidebar"></aside>
<div class="main-content">
  <!-- Category Form -->
  <form data-form="tags" action="../api/index/widgets/save?widget=tags" method="post" data-ajax-submit="true" data-load-api="../api/index/widgets/get?widget=tags"
        data-confirm="Confirm save">
    <header data-component="topbar"></header>
    <main class="content">
      <div class="card-groups">
        <header>
          <div>
            <h1 class="icon-tags" data-i18n>Tags</h1>
            <p data-i18n>Manage the tags</p>
          </div>
        </header>
        <div class="content-body">
          <!-- Per-block display option for a tags widget placed via the
               Designer's "Add Widget" menu (js/designer/inspector/Widget.js
               picks this compact div over the page's own big data-form
               below it — embedding the whole tag-management table in the
               side panel would be unusably large). Deliberately a <div>,
               not a <form> — see widgets/document/document.html for why.
               The tag list itself is managed in the table below, shared
               across the whole site regardless of which block shows it. -->
          <div data-widget-settings-form="true" class="gcms-panel-section">
            <h4 data-i18n>Widget display option</h4>
            <div>
              <label for="tags-module" data-i18n>Module</label>
              <span class="form-control">
                <input type="text" id="tags-module" name="module" value="tag" placeholder="tag">
              </span>
              <div class="comment" data-i18n>
                Only change this if the site has more than one tag module
              </div>
            </div>
          </div>

          <fieldset class="grid">
            <div class="tablebody">
              <table class="table border fullwidth" data-table="tags" data-editable-rows="true" data-attr="data:options" data-dynamic-columns="true">
                <thead>
                  <tr>
                    <th data-field="id" class="center" data-cell-element="number" data-size="5">ID</th>
                    <th data-field="tag" class="center" data-cell-element="text" data-i18n>{LNG_Tag}</th>
                    <th data-field="count" class="center" data-cell-element="number" data-size="5" data-i18n>{LNG_Clicked}</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </fieldset>

          <fieldset class="submit">
            <button type="submit" class="btn btn-primary icon-save" data-i18n>Save</button>
          </fieldset>
        </div>
      </div>
    </main>
  </form>
</div>
<footer class="footer">
