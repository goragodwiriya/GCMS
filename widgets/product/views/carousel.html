<div class="item product-card" data-product-id="{ID}">
  <a class="item-link" href="{URL}">
    <div class="figure">
      <img src="{THUMB}" alt="{TOPIC}" loading="lazy">
    </div>
    <div class="widget-body">
      <h3 class="product-title">{TOPIC}</h3>
      <div class="product-footer">
        <span class="product-price">{PRICE} <span class="currency" data-i18n>THB</span></span>
        {BUTTON}
      </div>
    </div>
  </a>
</div>
