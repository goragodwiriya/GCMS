<div class="item" data-product-id="{ID}">
  <a class="figure" href="{URL}">
    <img src="{THUMB}" alt="{TOPIC}" loading="lazy">
    {BADGET}
  </a>
  <div class="widget-body">
    <h3><a href="{URL}">{TOPIC}</a></h3>
    <div class="description">{DESCRIPTION}</div>
    <footer>
      <span class="product-price">{PRICE} <span class="currency">{CURRENCY}</span></span>
      {BUTTON}
    </footer>
  </div>
</div>
