<div class="stat-card" {STYLE}>
  <div class="stat-icon"><span class="{ICON}"></span></div>
  <div class="stat-body">
    <div class="stat-number">
      <span data-component="counter" data-end="{VALUE}" data-duration="{DURATION}" data-format="{FORMAT}" data-separator="{SEPARATOR}" data-decimal="{DECIMAL}"
            data-decimal-places="{DECIMALS}" {PREFIX_ATTR} {SUFFIX_ATTR} data-scroll-trigger="true" data-easing="easeOutExpo"></span>
    </div>
    <div class="stat-label">{LABEL}</div>
    {DESCRIPTION}
  </div>
</div>
