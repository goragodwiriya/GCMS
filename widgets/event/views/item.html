<a class="widget-event-item item" href="{URL}" style="--event-color:{COLOR}">
  <div class="widget-event-date">
    <span class="widget-event-day">{DAY}</span>
    <span class="widget-event-month">{MONTH}</span>
  </div>
  <div class="widget-body">
    <h3 class="two_line">{TOPIC}</h3>
    <time class="description icon-clock" datetime="{DATEISO}">{DATE} {TIME}</time>
  </div>
</a>
