<form id="{ID}" class="widget-search" method="get" action="{ACTION}" role="search">
  <input type="hidden" name="module" value="{MODULE}">
  <span class="widget-search__field">
    <input class="widget-search__input" type="search" name="q" value="{QUERY}" placeholder="{PLACEHOLDER}" aria-label="{PLACEHOLDER}" autocomplete="off">
    <button class="widget-search__submit icon-search" type="submit" title="{BTN_TITLE}" aria-label="{BTN_TITLE}"></button>
  </span>
</form>
