<aside data-component="sidebar"></aside>
<div class="main-content">
  <div>
    <header data-component="topbar"></header>
    <main class="content">
      <div class="card-groups">
        <header>
          <div>
            <h1 class="icon-ads" data-i18n>Text links</h1>
            <p data-i18n>Manage text links and advertisements</p>
          </div>
          <a class="btn btn-primary icon-new" href="/widgets/textlinks/textlink" data-params="name" data-i18n>{LNG_Add} {LNG_Text link}</a>
        </header>

        <div class="content-body">
          <div class="tablebody">
            <table class="table border fullwidth" data-table="textlinks" data-source="../api/index/widgets/table?widget=textlinks" data-row-sortable="true" data-page-size="10"
                   data-show-checkbox="true" data-actions='{"delete":"Delete", "status|published_1":"Published", "status|published_0":"Unpublished"}'
                   data-action-url="../api/index/widgets/tableaction?widget=textlinks" data-row-actions='{
                              "edit": {
                                "label": "Edit",
                                "className": "btn btn-success icon-edit"
                              }
                          }'>
              <thead>
                <tr>
                  <th data-field="name" data-template="<span class='two_line'>${name}</span>" data-filter="true" data-type="select" data-show-all="true" data-all-value=""
                      data-i18n>{LNG_Name}</th>
                  <th data-field="description" data-template="<span class='two_line' title='${description}'>${description}</span>" data-i18n>{LNG_Description}</th>
                  <th data-field="url" data-template="<span class='two_line' title='${url}'>${url}</span>" data-i18n>{LNG_URL}</th>
                  <th data-field="text" data-template="<span class='two_line' title='${text}'>${text}</span>" data-i18n>{LNG_Notes}</th>
                  <th data-field="width" class="center" data-cell-class="center" data-i18n>{LNG_Size of} {LNG_Image}</th>
                  <th data-field="publish_start" class="center" data-cell-class="center" data-i18n>{LNG_Start date}</th>
                  <th data-field="publish_end" class="center" data-cell-class="center" data-i18n>{LNG_End date}</th>
                  <th data-field="published" class="center" data-cell-class="center" data-formatter="formatActiveStatus" data-i18n>{LNG_Published}</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
  <footer class="footer">
    <p class="center">&copy; 2026 GCMS - Powered by <a href="https://nowjs.net">Now.js</a></p>
  </footer>
</div>
