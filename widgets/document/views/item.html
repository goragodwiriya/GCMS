<a class="{COLS}" href="{URL}">
  <div class="figure">
    <img src="{THUMB}" alt="{TOPIC}" loading="lazy">
    {BADGET}
  </div>
  <div class="widget-body">
    <div>
      <h3>{TOPIC}</h3>
      <time class="date icon-calendar" datetime="{DATE}">{DATE {DATE} d M Y}</time>
    </div>
    <div class="description">{DESCRIPTION}</div>
  </div>
</a>
