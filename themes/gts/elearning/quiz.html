<!-- E-Learning: quiz. The page content is quizstart.html, quizform.html (an
     attempt is open) or quizresult.html (the latest submitted attempt) -->
<article class="main-page view-page">
  <header class="page-header view-header">
    <div class="container">
      <nav class="breadcrumbs one_line">
        <ul>{BREADCRUMBS}</ul>
      </nav>
      <h1 class="page__title">{TOPIC}</h1>
      <div class="header-meta">
        <a class="icon-elearning" href="{COURSE_URL}">{COURSE}</a>
        <span class="icon-question">{KIND}</span>
      </div>
    </div>
  </header>
  <div class="page-body">
    <div class="container">
      <div class="page-content">{CONTENT}</div>
    </div>
  </div>
</article>
