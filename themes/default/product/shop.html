<!-- Placed before </body> of every public page (the store's own module on its
     pages, otherwise the first product module): which module the page belongs
     to (modules/product/script.js calls the cart API with it) and the floating
     cart button, shown by the script while the cart has items -->
<div id="productShop" hidden data-module-id="{MODULE_ID}"></div>
<a id="productCartFab" class="icon-cart" href="{CHECKOUT_URL}" hidden aria-label="{LNG_Make payment}"><span class="count">0</span></a>
