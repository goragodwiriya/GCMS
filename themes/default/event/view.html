<article class="main-page event-view-page">
  <!-- Event Header -->
  <header class="page-header view-header" style="--event-color:{COLOR}">
    <div class="container">
      <nav class="breadcrumbs one_line">
        <ul>{BREADCRUMBS}</ul>
      </nav>
      <h1 class="page__title"><span class="event-view-color"></span>{TOPIC}</h1>
      <div class="header-meta">
        <time class="date icon-calendar" datetime="{DATEISO}">{DATE}</time>
        <span class="icon-clock">{FROM_TIME} {TO_TIME}</span>
      </div>
    </div>
  </header>
  <div class="page-body">
    <div class="container">
      <div class="page-content">
        <div class="event-detail">{DETAIL}</div>
      </div>
    </div>
  </div>
</article>
