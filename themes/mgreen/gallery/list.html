<article class="main-page gallery-list-page">
  <!-- Page Hero -->
  <header class="page-header hero">
    <div class="container">
      <nav class="breadcrumbs one_line">
        <ul>{BREADCRUMBS}</ul>
      </nav>
      <h1 class="page__title">{TOPIC}</h1>
    </div>
  </header>
  <div class="page-body">
    <div class="container">
      <div class="page-content">
        <!-- Detail Section (optional) -->
        <section class="page-detail">{DETAIL}</section>
        <!-- Albums Grid -->
        <section class="ggrid thumbview">{LIST}</section>
        <nav class="pagination-wrapper">{PAGINATION}</nav>
      </div>
    </div>
  </div>
</article>
