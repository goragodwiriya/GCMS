<!-- E-Learning: course listing (listitem.html per course) -->
<article class="main-page lists-page">
  <header class="page-header hero">
    <div class="container">
      <nav class="breadcrumbs one_line">
        <ul>{BREADCRUMBS}</ul>
      </nav>
      <h1 class="page__title">{TOPIC}</h1>
      <p class="page__subtitle">{DESCRIPTION}</p>
    </div>
  </header>
  <div class="page-body">
    <div class="container">
      <div class="page-content">
        <section class="page-detail">{DETAIL}</section>
        <section class="ggrid thumbview">{LIST}</section>
        <nav class="text-center">
          <a class="btn btn-secondary icon-verfied" href="{VERIFY_URL}">{LNG_Verify certificate}</a>
        </nav>
      </div>
    </div>
  </div>
</article>
