<article class="item block{COLS}">
  <a href="{URL}" class="figure">
    <img src="{COVER}" alt="{TOPIC}" loading="lazy">
  </a>
  <div class="widget-body">
    <div>
      <h3><a href="{URL}" title="{TOPIC}">{TOPIC}</a></h3>
      <p class="description">{DESCRIPTION}</p>
    </div>
    <footer>
      <span class="widget-meta">
        <span class="icon-estudent">{CLASS}</span>
        <span class="icon-book">{LESSONS} {LNG_lessons}</span>
      </span>
      <span class="badge-success" {CERT} data-badge="{LNG_Certificate}"></span>
    </footer>
  </div>
</article>
