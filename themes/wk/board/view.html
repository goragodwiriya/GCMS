<div class="board-view-section">
  <!-- Board Header -->
  <header class="view-header">
    <div class="container">
      <nav class="breadcrumbs one_line">
        <ul>{BREADCRUMBS}</ul>
      </nav>
      <h1>{TOPIC}</h1>
      <div class="header-meta">
        <span class="icon-user">{SENDER}</span>
        <time class="date icon-calendar" datetime="{DATE}">{DATE {DATE} d M Y H:i}</time>
        <span class="icon-visited">{VISITED} {LNG_Views}</span>
        <span class="icon-comments">{COMMENTS} {LNG_Replies}</span>
        <div class="board-view-actions {MODERATOR}">
          <button type="button" class="icon-{PIN}" data-id="{PIN}-{MODULE_ID}-{ID}-0"></button>
          <button type="button" class="icon-{LOCKED}" data-id="{LOCKED}-{MODULE_ID}-{ID}-0"></button>
          <button type="button" class="icon-delete" data-id="delete-{MODULE_ID}-{ID}-0"></button>
        </div>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="section__content">
      <!-- Original post -->
      <div class="board-post board-op">
        <div class="post-body">
          {DETAIL}
        </div>
      </div>

      <!-- Replies -->
      <div class="board-replies" id="board-replies">
        {REPLIES}
      </div>

      <!-- Reply form -->
      {REPLY_FORM}
    </div>
  </div>
</div>
<script>
  window.addEventListener('DOMContentLoaded', () => {
    initBoardView();
  });
</script>
