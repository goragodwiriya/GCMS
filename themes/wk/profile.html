<form class="profile" data-form="profile" data-validate="true" action="{WEBURL}api/index/profile/save" method="post" data-ajax-submit="true"
      data-load-api="{WEBURL}api/index/profile/get" autocomplete="off" data-on-load="initProfile">

  <header class="hero">
    <div class="container">
      <h1 class="hero-title" data-i18n>Edit profile</h1>
      <p class="hero-subtitle" data-i18n>Edit your profile information below.</p>
    </div>
  </header>

  <div class="container">
    <div class="page-content">
      <!-- Account Information -->
      <fieldset>
        <legend data-i18n>Account Information</legend>

        <div>
          <label for="username" data-i18n>Username</label>
          <span class="form-control icon-user">
            <input type="text" id="username" name="username" required maxlength="50" autofocus data-attr="value:username" disabled autocomplete="off">
          </span>
        </div>

        <div>
          <div class="form-group">
            <div class="width50">
              <label for="password" data-i18n>Password</label>
              <span class="form-control icon-password">
                <input data-element="password" maxlength="20" type="password" id="password" name="password" autocomplete="new-password" data-password-criteria-list="false"
                       data-password-strength="bar">
              </span>
            </div>
            <div class="width50">
              <label for="repassword" data-i18n>Confirm Password</label>
              <span class="form-control icon-password">
                <input data-element="password" maxlength="20" type="password" id="repassword" name="repassword" data-target-password="password">
              </span>
            </div>
          </div>
          <div class="comment" id="result_password" data-i18n>
            Password must be at least 8 characters long and contain at least one uppercase letter and one lowercase letter.
          </div>
        </div>
      </fieldset>

      <!-- Personal Information -->
      <fieldset>
        <legend data-i18n>Personal Information</legend>

        <div>
          <label for="avatar" data-i18n>Avatar</label>
          <span class="form-control icon-portfolio">
            <input type="file" id="avatar" name="avatar" data-files="avatar" data-preview="true" data-allow-remove-existing="true"
                   data-action-url="../api/index/profile/remove-avatar" data-file-reference="url" accept="image/*">
          </span>
          <div class="comment" id="result_avatar" data-i18n>
            {LNG_Browse image uploaded, type} jpg, jpeg, png, webp
          </div>
        </div>

        <div>
          <label for="name" data-i18n>Full Name</label>
          <span class="form-control icon-profile">
            <input type="text" id="name" name="name" data-attr="value:name" required maxlength="150" autocomplete="off">
          </span>
        </div>

        <div>
          <div class="form-group">
            <div class="width50">
              <label for="sex" data-i18n>Gender</label>
              <span class="form-control icon-menus">
                <select id="sex" name="sex" data-options-key="sex" data-attr="value:sex">
                  <option value="">Not specified</option>
                </select>
              </span>
            </div>
            <div class="width50">
              <label for="birthday" data-i18n>Birthday</label>
              <span class="form-control icon-calendar">
                <input type="date" id="birthday" name="birthday" data-attr="value:birthday">
              </span>
            </div>
          </div>
        </div>

        <div>
          <div class="form-group">
            <div class="width50">
              <label for="id_card" data-i18n>ID Card</label>
              <span class="form-control icon-profile">
                <input type="text" id="id_card" name="id_card" data-attr="value:id_card" maxlength="13">
              </span>
            </div>
            <div class="width50">
              <label for="tax_id" data-i18n>Tax ID</label>
              <span class="form-control icon-profile">
                <input type="text" id="tax_id" name="tax_id" data-attr="value:tax_id" maxlength="13">
              </span>
            </div>
          </div>
        </div>
      </fieldset>

      <!-- Contact Information -->
      <fieldset>
        <legend data-i18n>Contact Information</legend>

        <div>
          <div class="form-group">
            <div class="width50">
              <label for="phone" data-i18n>Phone</label>
              <span class="form-control icon-phone">
                <input type="tel" id="phone" name="phone" data-attr="value:phone" maxlength="20" autocomplete="off">
              </span>
            </div>
            <div class="width50">
              <label for="phone1" data-i18n>Fax</label>
              <span class="form-control icon-print">
                <input type="tel" id="phone1" name="phone1" data-attr="value:phone1" maxlength="20">
              </span>
            </div>
          </div>
        </div>

        <div>
          <label for="website" data-i18n>Website</label>
          <span class="form-control icon-link">
            <input type="url" id="website" name="website" data-attr="value:website" maxlength="255" placeholder="https://">
          </span>
        </div>

        <div>
          <label for="company" data-i18n>Company</label>
          <span class="form-control icon-office">
            <input type="text" id="company" name="company" data-attr="value:company" maxlength="64" autocomplete="off">
          </span>
        </div>
      </fieldset>

      <!-- Address Information -->
      <fieldset>
        <legend data-i18n>Address</legend>

        <div>
          <label for="address" data-i18n>{LNG_Address} 1</label>
          <span class="form-control icon-address">
            <textarea rows="2" id="address" name="address" data-text="address" maxlength="64" autocomplete="off"></textarea>
          </span>
        </div>

        <div>
          <label for="address2" data-i18n>{LNG_Address} 2</label>
          <span class="form-control icon-address">
            <textarea rows="2" id="address2" name="address2" data-text="address2" maxlength="64"></textarea>
          </span>
        </div>

        <div class="form-group">
          <div class="width50">
            <label for="provinceID" data-i18n>Province</label>
            <span class="form-control icon-location">
              <input type="text" id="provinceID" name="provinceID" data-options-key="province" data-attr="value:provinceID" placeholder="{LNG_Type to search}">
            </span>
          </div>
          <div class="width50">
            <label for="zipcode" data-i18n>Zipcode</label>
            <span class="form-control icon-location">
              <input type="text" id="zipcode" name="zipcode" data-attr="value:zipcode" maxlength="5">
            </span>
          </div>
        </div>
      </fieldset>

      <fieldset class="submit">
        <button type="submit" class="btn btn-primary large icon-save" data-i18n>Save</button>
        <input type="hidden" name="id" data-attr="value:id">
      </fieldset>
    </div>
  </div>
</form>
