<div class="gallery-list-page">
  <!-- Page Hero -->
  <div class="page-header hero">
    <div class="container">
      <h1 class="page__title">{TOPIC}</h1>
      <p class="page__subtitle">{DESCRIPTION}</p>
    </div>
  </div>
  <div class="container">
    <div class="page-body">
      <div class="section__content">
        <!-- Detail Section (optional) -->
        <section class="section__content">{DETAIL}</section>
        <!-- Albums Grid -->
        <section class="ggrid thumbview">{LIST}</section>
        <nav class="pagination-wrapper">{PAGINATION}</nav>
      </div>
    </div>
  </div>
</div>
