<div class="auth-container">
  <div class="auth-card">
    <form data-form="register" class="auth-form" novalidate action="{WEBURL}api/index/auth/register" method="post" data-ajax-submit="true" data-validate="true"
          data-auto-fill-intended-url="true">
      <div class="auth-header">
        <a href="index.html" class="auth-logo"></a>
        <h1 data-text="data.web_title" data-i18n></h1>
        <h2 data-i18n>Create Account</h2>
        <p class="login-message" data-i18n>Join us today! Create your free account.</p>
      </div>

      <fieldset>
        <div>
          <label for="register_username" data-i18n>Email</label>
          <span class="form-control icon-email">
            <input maxlength="255" type="email" id="register_username" name="username" autocomplete="email" autofocus required placeholder="your@email.com">
          </span>
        </div>

        <div>
          <label for="register_name" data-i18n>Full Name</label>
          <span class="form-control icon-profile">
            <input maxlength="150" type="text" id="register_name" name="name" autocomplete="name" required>
          </span>
        </div>

        <div>
          <label for="register_password" data-i18n>Password</label>
          <span class="form-control icon-password">
            <input data-element="password" minlength="8" maxlength="20" type="password" id="register_password" name="password" autocomplete="new-password"
                   data-password-criteria-list="true" data-password-strength="bar" required>
          </span>
        </div>

        <div>
          <label for="register_repassword" data-i18n>Confirm Password</label>
          <span class="form-control icon-password">
            <input data-element="password" minlength="8" maxlength="20" type="password" id="register_repassword" name="repassword" data-target-password="register_password"
                   required>
          </span>
        </div>
        <div class="comment" id="result_register_password" data-i18n>
          Password must be at least 8 characters long and contain at least one uppercase letter and one lowercase letter.
        </div>

        <div>
          <label class="checkbox-label">
            <input type="checkbox" id="accept_terms" name="accept_terms" value="1" required>
            <span data-i18n>I agree to the</span> <a href="{WEBURL}terms" target="_blank" data-i18n>Terms of Service</a> <span data-i18n>and</span> <a href="{WEBURL}privacy"
               target="_blank" data-i18n>Privacy Policy</a>
          </label>
        </div>
      </fieldset>

      <fieldset class="text-center">
        <button type="submit" class="btn btn-primary fullwidth large icon-register" data-i18n>Create Account</button>
      </fieldset>

      <!-- Social Registration Divider -->
      <div class="social-divider" data-if="data.google_client_id || data.line_channel_id || data.facebook_appId || data.telegram_bot_username">
        <span data-i18n>Or continue with</span>
      </div>

      <!-- Social Registration Buttons -->
      <fieldset class="text-center" data-if="data.google_client_id || data.line_channel_id || data.facebook_appId || data.telegram_bot_username">
        <div class="social-login-buttons">
          <div data-attr="data-username:data.google_client_id" data-social-provider="google" data-if="data.google_client_id"></div>
          <button type="button" data-attr="data-username:data.line_channel_id" class="btn icon-line" data-social-provider="line" data-i18n
                  data-if="data.line_channel_id">LINE</button>
          <button type="button" data-attr="data-username:data.facebook_appId" class="btn icon-facebook" data-social-provider="facebook" data-i18n
                  data-if="data.facebook_appId">Facebook</button>
          <div data-attr="data-username:data.telegram_bot_username" data-social-provider="telegram" data-if="data.telegram_bot_username"></div>
        </div>
      </fieldset>
    </form>
  </div>
</div>
