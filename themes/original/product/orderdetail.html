<!-- Order Detail Page -->
<div class="order-detail-container" data-component="api" data-endpoint="{WEBURL}api/product/myorders/view" data-method="GET" data-url-params="true">
  <div class="container">
    <!-- Order Header -->
    <div class="order-detail-header">
      <div class="order-title-section">
        <h1 class="order-title"><span data-i18n>Order</span> #<span data-text="order_no"></span></h1>
        <span class="order-status-badge" data-text="order_status_text" data-attr="class:'order-status-badge status-' + order_status"></span>
      </div>
      <div class="order-meta">
        <div class="meta-item">
          <span class="meta-label" data-i18n>Order Date</span>
          <span class="meta-value" data-text="created_at" data-format="datetime"></span>
        </div>
        <div class="meta-item" data-if="payment_date">
          <span class="meta-label" data-i18n>Payment Date</span>
          <span class="meta-value" data-text="payment_date" data-format="datetime"></span>
        </div>
      </div>
    </div>

    <!-- Order Details Grid -->
    <div class="order-details-grid">
      <!-- Customer Information -->
      <div class="detail-card">
        <h2 class="card-title" data-i18n>Customer information</h2>
        <div class="info-group">
          <div class="info-item">
            <span class="info-label" data-i18n>Name</span>
            <span class="info-value" data-text="name"></span>
          </div>
          <div class="info-item">
            <span class="info-label" data-i18n>Phone</span>
            <span class="info-value" data-text="phone"></span>
          </div>
        </div>
      </div>

      <!-- Shipping Address -->
      <div class="detail-card">
        <h2 class="card-title" data-i18n>Shipping Address</h2>
        <div class="info-group">
          <p class="address-text">
            <span data-text="address"></span>
            <span data-i18n>Province</span> <span data-text="province"></span>
            <span data-i18n>Zipcode</span> <span data-text="zipcode"></span>
          </p>
        </div>
      </div>

      <!-- Payment information -->
      <div class="detail-card">
        <h2 class="card-title" data-i18n>Payment information</h2>
        <div class="info-group">
          <div class="info-item">
            <span class="info-label" data-i18n>Payment Method</span>
            <span class="info-value" data-text="payment_method" data-i18n></span>
          </div>
          <div class="info-item" data-if="payment_ref">
            <span class="info-label" data-i18n>Reference No</span>
            <span class="info-value" data-text="payment_ref"></span>
          </div>
          <div data-if="payment_proof" style="margin-top: 1rem;">
            <span class="info-label" data-i18n>Payment Proof</span>
            <div class="payment-proof-container">
              <img class="payment-proof-image" data-attr="src:payment_proof" alt="Payment Proof">
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Order Items -->
    <div class="order-items-section">
      <h2 class="section-title" data-i18n>Order Items</h2>
      <div class="tablebody">
        <table class="items-table">
          <thead>
            <tr>
              <th data-i18n>{LNG_Product}</th>
              <th class="text-center" data-i18n>{LNG_Quantity}</th>
              <th class="text-center" data-i18n>{LNG_Price}</th>
              <th class="text-center" data-i18n>{LNG_Total}</th>
            </tr>
          </thead>
          <tbody data-for="item of items">
            <template>
              <tr>
                <td>
                  <div class="item-info">
                    <span class="item-name" data-text="item.topic"></span>
                    <span class="item-code"><span data-i18n>Product No.</span>: <span data-text="item.product_no"></span></span>
                  </div>
                </td>
                <td class="text-center" data-text="item.quantity"></td>
                <td class="text-right" data-text="item.price" data-format="currency:THB"></td>
                <td class="text-right" data-text="item.total" data-format="currency:THB"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Order Summary -->
    <div class="order-summary">
      <div class="summary-row">
        <span class="summary-label" data-i18n>Subtotal</span>
        <span class="summary-value" data-text="subtotal" data-format="currency:THB"></span>
      </div>
      <div class="summary-row">
        <span class="summary-label" data-i18n>Shipping</span>
        <span class="summary-value" data-text="transport" data-format="currency:THB"></span>
      </div>
      <div class="summary-row" data-if="discount > 0">
        <span class="summary-label" data-i18n>Discount</span>
        <span class="summary-value discount-text">- <span data-text="discount" data-format="currency:THB"></span></span>
      </div>
      <div class="summary-row total-row">
        <span class="summary-label" data-i18n>Grand Total</span>
        <span class="summary-value total-value" data-text="total" data-format="currency:THB"></span>
      </div>
    </div>

    <!-- Notes -->
    <div class="notes-section" data-if="notes">
      <h3 class="notes-title" data-i18n>Notes</h3>
      <p class="notes-text" data-text="notes"></p>
    </div>
  </div>
</div>
