<article class="download-topic-item" data-id="{ID}">
  <div class="download-topic-badges">
    <span class="icon-edocument"></span>
  </div>
  <div class="download-topic-main">
    <a id="edocument_{ID}" href="" class="download-topic-title">{NAME}.{EXT}</a>
    <div class="download-meta">
      <span class="icon-number" title="{LNG_Document number}">{NO}</span>
      <span class="icon-user" title="{LNG_Sender}">{SENDER}</span>
      <span class="icon-calendar" title="{LNG_Last updated}">{DATE {DATE} d M Y H:i}</span>
      <span title="{LNG_File size}">{LNG_File size} {SIZE}</span>
      <span class="icon-visited" title="{LNG_Download}">{LNG_Download} <span id="edocument_downloads_{ID}">{DOWNLOADS}</span></span>
    </div>
    <div class="description">{DETAIL}</div>
  </div>
</article>
