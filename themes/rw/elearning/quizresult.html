<!-- Result of the latest attempt, followed by review.html per question when the
     quiz shows its answers -->
<section class="section-bg">
  <div class="section__header">
    <h2 class="icon-report">{LNG_Quiz result}</h2>
  </div>
  <div class="section__body">
    <aside class="{RESULT_CLASS}" {RESULT_HIDDEN}>
      <strong class="{RESULT_ICON}">{RESULT}</strong>
    </aside>
    <p class="comment icon-calendar">{DATE}</p>
    <div class="gcms-stats-bar">
      <div class="gcms-stat-item">
        <strong>{SCORE}</strong>
        <span class="gcms-stat-label">{LNG_Score}</span>
      </div>
      <div class="gcms-stat-item">
        <strong>{PERCENT}%</strong>
        <span class="gcms-stat-label">{LNG_Percent}</span>
      </div>
      <div class="gcms-stat-item">
        <strong>{BEST}</strong>
        <span class="gcms-stat-label">{LNG_Best score}</span>
      </div>
      <div class="gcms-stat-item" {PASS_HIDDEN}>
        <strong>{PASS}%</strong>
        <span class="gcms-stat-label">{LNG_Passing score}</span>
      </div>
    </div>
    <aside class="success" {CERT_HIDDEN}>
      <p class="icon-verfied">{LNG_Congratulations! You have received a certificate}</p>
      <a class="btn btn-success" href="{CERT_URL}">{LNG_View certificate}</a>
    </aside>
    <div class="section-actions">
      <a class="btn btn-secondary icon-prev" href="{COURSE_URL}">{LNG_Back to course}</a>
      <form data-form="elearningRetry" {RETRY_HIDDEN} action="{WEBURL}api/elearning/learn/start" method="post" data-ajax-submit="true">
        <input type="hidden" name="quiz_id" value="{QUIZ_ID}">
        <button type="submit" class="btn btn-primary icon-refresh">{LNG_Try again} ({ATTEMPTS})</button>
      </form>
    </div>
  </div>
</section>
{REVIEW}
