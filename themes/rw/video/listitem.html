<div class="item block{COLS} video-card" data-id="{ID}" data-youtube="{YOUTUBE}" data-topic="{TOPIC}" role="button" tabindex="0" title="{TOPIC}">
  <div class="figure">
    <img src="{PICTURE}" alt="{TOPIC}" loading="lazy">
    <div class="album-overlay">
      <span class="album-view-icon icon-play"></span>
    </div>
  </div>
  <div class="widget-body">
    <div>
      <h3 class="two_line">{TOPIC}</h3>
      <p class="description two_line">{DESCRIPTION}</p>
    </div>
    <div class="video-meta">
      <time class="date icon-event" datetime="{DATEISO}">{DATE}</time>
      <span class="icon-visited" title="{LNG_Views}"><span class="video-views">{VIEWS}</span></span>
    </div>
  </div>
</div>
