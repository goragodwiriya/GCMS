<article class="main-page gallery-album-page" data-album-id="{ID}" data-default-mode="{DEFAULT_MODE}">
  <!-- Album Header -->
  <header class="page-header view-header">
    <div class="container">
      <nav class="breadcrumbs one_line">
        <ul>{BREADCRUMBS}</ul>
      </nav>
      <h1 class="page__title">{TOPIC}</h1>
      <p class="page__subtitle">{DESCRIPTION}</p>
      <div class="header-meta">
        <span class="icon-image"><strong>{COUNT}</strong> <span data-i18n>photos</span></span>
        <time class="date icon-event" datetime="{DATE}">{DATE {DATE} d M Y}</time>
        <!-- View mode toggle -->
        <div class="album-view-toggle" role="group" aria-label="View mode">
          <button class="btn-view-mode" data-mode="slideshow" title="Slideshow" aria-label="Slideshow view">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2" />
              <polyline points="8 21 12 17 16 21" />
            </svg>
          </button>
          <button class="btn-view-mode" data-mode="grid" title="Grid" aria-label="Grid view">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" />
              <rect x="14" y="3" width="7" height="7" />
              <rect x="3" y="14" width="7" height="7" />
              <rect x="14" y="14" width="7" height="7" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </header>
  <div class="page-body">
    <div class="container">
      <div class="page-content">
        <!-- Mode: Slideshow -->
        <section class="gallery-slideshow-section" id="albumSlideshowSection">
          <div class="gallery-slideshow" id="gallerySlideshow" data-slideshow data-count="{COUNT}">{SLIDES}</div>
        </section>
        <!-- Mode: Masonry Grid -->
        <section class="gallery-grid-section" id="albumGridSection" style="display:none">
          <div class="gallery-masonry-grid" id="galleryMasonryGrid"></div>
        </section>
      </div>
    </div>
  </div>
</article>
<script>
  (function () {
    'use strict';

    function initAlbumModes() {
      var page = document.querySelector('.gallery-album-page');
      if (!page) return;

      var defaultMode = page.dataset.defaultMode || 'slideshow';
      var slideshowSection = document.getElementById('albumSlideshowSection');
      var gridSection = document.getElementById('albumGridSection');
      var slideshowEl = document.getElementById('gallerySlideshow');
      var masonryGrid = document.getElementById('galleryMasonryGrid');
      var toggleBtns = document.querySelectorAll('.btn-view-mode');

      // ── Build masonry grid from slideshow slides ────────────────
      function buildMasonryGrid() {
        if (!masonryGrid || masonryGrid.dataset.built) return;
        var slides = slideshowEl ? slideshowEl.querySelectorAll('.now-slide') : [];
        var html = '';
        slides.forEach(function (slide, idx) {
          var img = slide.querySelector('img');
          if (!img) return;
          html += '<div class="masonry-item" data-index="' + idx + '">' +
            '<img src="' + img.src + '" alt="' + (img.alt || '') + '" loading="lazy">' +
            '<div class="masonry-overlay"><span class="masonry-zoom-icon"></span></div>' +
            '</div>';
        });
        masonryGrid.innerHTML = html;
        masonryGrid.dataset.built = '1';

        // Wire clicks → open lightbox via GallerySlideshow instance
        masonryGrid.querySelectorAll('.masonry-item').forEach(function (item) {
          item.addEventListener('click', function () {
            var idx = parseInt(item.dataset.index, 10);
            var ss = slideshowEl && slideshowEl._ssInstance;
            if (ss) {
              ss.goTo(idx);
              ss._openLightbox(idx);
            }
          });
        });
      }

      // ── Switch mode ─────────────────────────────────────────────
      function setMode(mode) {
        if (mode === 'grid') {
          buildMasonryGrid();
          slideshowSection.style.display = 'none';
          gridSection.style.display = '';
          var ss = slideshowEl && slideshowEl._ssInstance;
          if (ss) ss.pause();
        } else {
          slideshowSection.style.display = '';
          gridSection.style.display = 'none';
          var ss = slideshowEl && slideshowEl._ssInstance;
          if (ss) { if (ss.options && ss.options.autoplay) ss.play(); }
        }
        toggleBtns.forEach(function (btn) {
          btn.classList.toggle('active', btn.dataset.mode === mode);
        });
        try { localStorage.setItem('gallery_album_view', mode); } catch (e) { }
      }

      // ── Toggle button events ────────────────────────────────────
      toggleBtns.forEach(function (btn) {
        btn.addEventListener('click', function () {
          setMode(btn.dataset.mode);
        });
      });

      // ── Restore last used mode (localStorage > default from settings) ──
      var savedMode = null;
      try { savedMode = localStorage.getItem('gallery_album_view'); } catch (e) { }
      setMode(savedMode || defaultMode);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initAlbumModes);
    } else {
      // GallerySlideshow may need a tick to attach _ssInstance
      setTimeout(initAlbumModes, 0);
    }

    // Now.js SPA re-init
    var re = function () { setTimeout(initAlbumModes, 0); };
    if (window.EventManager) {
      EventManager.on('page:loaded', re);
    } else {
      document.addEventListener('page:loaded', re);
    }
  }());
</script>
