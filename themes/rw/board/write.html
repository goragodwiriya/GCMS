<article class="main-page board-newtopic-section">
  <header class="page-header hero">
    <div class="container">
      <nav class="breadcrumbs one_line">
        <ul>{BREADCRUMBS}</ul>
      </nav>
      <h1 class="page__title" data-i18n>{NEW_TOPIC}</h1>
      <p class="page__subtitle">{TOPIC}</p>
    </div>
  </header>
  <div class="page-body">
    <div class="container">
      <div class="page-content">
        <form data-form="boardTopic" data-validate="true" data-reset="true" action="api/board/topic/save" method="post" data-ajax-submit="true" data-sanitize-input="false"
              data-load-query-params="true" data-load-api="api/board/topic/get?board_module={MODULE}" autocomplete="off">
          <fieldset>
            <div class="{HAS_CATEGORY}">
              <label for="category_id">{LNG_Category}</label>
              <span class="form-control icon-tags">
                <select id="category_id" name="category_id" data-options-key="category_id" data-attr="value:category_id">
                  <option value="" data-i18n>-- {LNG_Please select} --</option>
                </select>
              </span>
              <div class="comment" id="result_category_id" data-i18n>{LNG_Choose a category related to your content.}</div>
            </div>
            <div>
              <label for="topic" data-i18n>{LNG_Topic}</label>
              <span class="form-control icon-edit">
                <input type="text" id="topic" name="topic" placeholder="{LNG_Specify topic}..." minlength="3" maxlength="255" data-attr="value:topic">
              </span>
              <div class="comment" id="result_topic" data-i18n>{LNG_Please specify topic title (at least 3 characters).}</div>
            </div>
            <div>
              <label for="detail" data-i18n>{LNG_Detail}</label>
              <span class="form-control icon-file">
                <textarea id="detail" name="detail" rows="10" placeholder="{LNG_Write the content here}...." data-attr="detail"></textarea>
              </span>
              <div class="comment" id="result_detail" data-i18n>{LNG_Please specify topic content (at least 5 characters).} {LNG_BBCode can be used.}</div>
            </div>
            <div class="{HAS_UPLOAD}">
              <label for="picture" data-i18n>{LNG_Image}</label>
              <span class="form-control icon-image">
                <input type="file" id="picture" name="picture" data-files='{PICTURE_JSON}' data-preview="true" data-allow-remove-existing="true"
                       data-action-url="api/board/topic/remove-picture" data-action-params='{"id":{ID},"module_id":{MODULE_ID}}' data-file-reference="url" accept="image/*">
              </span>
              <div class="comment" id="result_picture" data-i18n>{LNG_Type} <b>{IMG_TYPES}</b> {IMG_LAW}</div>
            </div>
            <div class="form-group" data-if="!member_id">
              <div class="width50">
                <label for="sender" data-i18n>{LNG_Name}</label>
                <span class="form-control icon-user">
                  <input type="text" id="sender" name="sender" maxlength="150" placeholder="{LNG_Name}" data-attr="value:sender">
                </span>
              </div>
              <div class="width50">
                <label for="email" data-i18n>{LNG_Email}</label>
                <span class="form-control icon-email">
                  <input type="email" id="email" name="email" maxlength="255" placeholder="{LNG_Email}" data-attr="value:email">
                </span>
              </div>
            </div>
          </fieldset>
          <fieldset class="submit text-right">
            <input type="hidden" name="module_id" value="{MODULE_ID}">
            <input type="hidden" name="id" value="{ID}">
            <button type="submit" class="btn btn-primary icon-send" data-i18n>{LNG_Post a topic}</button>
          </fieldset>
        </form>
      </div>
    </div>
  </div>
</article>
