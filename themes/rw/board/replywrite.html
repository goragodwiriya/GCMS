<article class="main-page board-newtopic-section">
  <header class="page-header hero">
    <div class="container">
      <nav class="breadcrumbs one_line">
        <ul>{BREADCRUMBS}</ul>
      </nav>
      <h1 class="page__title" data-i18n>{LNG_Edit reply}</h1>
      <p class="page__subtitle">{TOPIC}</p>
    </div>
  </header>
  <div class="page-body">
    <div class="container">
      <div class="page-content">
        <form data-form="boardReplyEdit" data-validate="true" data-reset="true" action="api/board/reply/save" method="post" data-ajax-submit="true" data-sanitize-input="false"
              data-load-query-params="true" data-load-api="api/board/reply/get?module_id={MODULE_ID}" autocomplete="off">
          <fieldset>
            <div>
              <label for="detail" data-i18n>{LNG_Detail}</label>
              <span class="form-control icon-file">
                <textarea id="detail" name="detail" rows="10" placeholder="{LNG_Write your reply}....">{DETAIL}</textarea>
              </span>
              <div class="comment" id="result_detail" data-i18n>{LNG_Reply content is required}</div>
            </div>
            <div class="{HAS_UPLOAD}">
              <label for="picture" data-i18n>{LNG_Image}</label>
              <span class="form-control icon-image">
                <input type="file" id="picture" name="picture" data-files='{PICTURE_JSON}' data-preview="true" data-allow-remove-existing="true"
                       data-action-url="api/board/reply/remove-picture" data-action-params='{"id":{ID},"module_id":{MODULE_ID}}' data-file-reference="url" accept="image/*">
              </span>
              <div class="comment" id="result_picture" data-i18n>{LNG_Type} <b>{IMG_TYPES}</b> {IMG_LAW}</div>
            </div>
          </fieldset>
          <fieldset class="submit text-right">
            <input type="hidden" name="module_id" value="{MODULE_ID}">
            <input type="hidden" name="id" value="{ID}">
            <input type="hidden" name="index_id" value="{TOPIC_ID}">
            <a class="btn btn-secondary icon-arrow-left" href="{TOPIC_URL}" data-i18n>{LNG_Cancel}</a>
            <button type="submit" class="btn btn-primary icon-send" data-i18n>{LNG_Save}</button>
          </fieldset>
        </form>
      </div>
    </div>
</article>
