<a class="event-day-item" href="{URL}" style="--event-color:{COLOR}">
  <span class="event-day-color"></span>
  <div class="event-day-body">
    <h3 class="event-day-title">{TOPIC}</h3>
    <div class="event-day-time icon-clock">{FROM_TIME} {TO_TIME}</div>
    <p class="description two_line">{DESCRIPTION}</p>
  </div>
</a>
