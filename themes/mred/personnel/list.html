<!-- Personnel List Page – Hierarchical Org-Chart Style -->
<article class="main-page personnel-page" id="personnelPage">
  <!-- Page Hero -->
  <header class="page-header hero">
    <div class="container">
      <nav class="breadcrumbs one_line">
        <ul>{BREADCRUMBS}</ul>
      </nav>
      <h1 class="page__title">{TOPIC}</h1>
      <p class="page__subtitle">{DESCRIPTION}</p>
    </div>
  </header>
  <div class="page-body">
    <div class="container">
      <div class="page-content">
        <!-- Optional Detail -->
        <section class="page-detail">{DETAIL}</section>
        <!-- Department Tabs -->
        <nav class="cat-links category-buttons" id="deptTabs" aria-label="Department filter">{DEPT_TABS}</nav>
        <!-- Personnel Hierarchy -->
        <div id="personnelContainer">{PERSONNEL_LIST}</div>
      </div>
    </div>
  </div>
</article>
<div id="personnel-modal" class="modal" aria-hidden="true" aria-modal="true" role="dialog" inert>
  <div class="modal-container">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-image-container">
          <img src="" alt="" class="modal-image active" id="modalImage" data-modal-target="photo">
          <div class="modal-image-placeholder" id="modalImagePlaceholder" style="display: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
        </div>
        <button class="modal-close" id="modalClose"></button>
      </div>
      <div class="modal-body">
        <div class="modal-person-info">
          <h2 class="modal-name" id="modalName" data-modal-target="name"></h2>
          <p class="modal-position" id="modalPosition" data-modal-target="position"></p>
          <p class="modal-department icon-home" id="modalDepartment" data-modal-target="department"></p>
        </div>
        <div class="modal-contact" data-show="email || phone">
          <h3 class="modal-section__header" data-i18n>{LNG_Personnel Information}</h3>
          <div class="modal-contact-item" data-show="phone">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path
                    d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z">
              </path>
            </svg>
            <span id="modalPhone" data-modal-target="phone"></span>
          </div>
          <div class="modal-contact-item" data-show="email">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            <span id="modalEmail" data-modal-target="email"></span>
          </div>
        </div>
        <div class="modal-bio" data-show="detail">
          <h3 class="modal-section__header" data-i18n>{LNG_Biography}</h3>
          <p id="modalBio" data-modal-target="detail"></p>
        </div>
      </div>
    </div>
  </div>
</div>
