<article class="main-page view-page">
  <header class="page-header view-header">
    <div class="container">
      <nav class="breadcrumbs one_line">
        <ul>{BREADCRUMBS}</ul>
      </nav>
      <h1 class="page__title">{TOPIC}</h1>
      <div class="header-meta">
        <span class="icon-user">{SENDER}</span>
        <time class="date icon-calendar" datetime="{DATE}">{DATE {DATE} d M Y H:i}</time>
        <span class="icon-visited">{VISITED} {LNG_Views}</span>
        <span class="icon-comments">{COMMENTS} {LNG_Replies}</span>
        <div class="comment-actions {MODERATOR}">
          <button type="button" class="icon-{PIN}" data-id="{PIN}-{MODULE_ID}-{ID}-0"></button>
          <button type="button" class="icon-{LOCKED}" data-id="{LOCKED}-{MODULE_ID}-{ID}-0"></button>
          <button type="button" class="icon-delete" data-id="delete-{MODULE_ID}-{ID}-0"></button>
          <a class="icon-edit {CAN_EDIT}" href="{EDIT_URL}" title="{LNG_Edit}"></a>
        </div>
      </div>
    </div>
  </header>
  <div class="page-body">
    <div class="container">
      <div class="page-content">
        <!-- Original post -->
        <div class="board-post board-op">
          <div class="page-detail">{PICTURE}{DETAIL}</div>
        </div>
        <!-- Replies -->
        <div class="board-replies" id="board-replies">{REPLIES}</div>
        <!-- Reply form --> {REPLY_FORM}
      </div>
    </div>
  </div>
</article>
<script>
  window.addEventListener('DOMContentLoaded', () => {
    initBoardView();
  });
</script>
