<div class="error-container">
  <div class="error-card">
    <h1 class="error-code-number">404</h1>
    <p class="error-message" data-i18n>The page you're looking for doesn't exist.</p>

    <div class="error-actions">
      <button class="btn btn-primary" onclick="window.location.href='{WEBURL}'">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span data-i18n>Go to Homepage</span>
      </button>
    </div>

    <div class="error-help" data-i18n>
      If the problem persists, please contact your system administrator or try clearing your browser cache.
    </div>
  </div>
</div>
