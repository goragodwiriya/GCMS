  <rect x="8" y="107" width="100" height="58" rx="5" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
  <rect x="8" y="107" width="100" height="22" rx="5" fill="url(#panelHdr)"/>
  <rect x="8" y="119" width="100" height="10" rx="0" fill="url(#panelHdr)"/>
  <rect x="16" y="112" width="55" height="5" rx="2" fill="#fef3c7" opacity="0.95"/>
  <rect x="16" y="136" width="82" height="4" rx="2" fill="#78716c" opacity="0.6"/>
  <rect x="16" y="144" width="65" height="4" rx="2" fill="#78716c" opacity="0.5"/>
  <rect x="16" y="152" width="74" height="4" rx="2" fill="#78716c" opacity="0.4"/>

  <!-- Panel 2 -->
  <rect x="8" y="170" width="100" height="58" rx="5" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
  <rect x="8" y="170" width="100" height="22" rx="5" fill="url(#panelHdr)"/>
  <rect x="8" y="182" width="100" height="10" rx="0" fill="url(#panelHdr)"/>
  <rect x="16" y="175" width="60" height="5" rx="2" fill="#fef3c7" opacity="0.95"/>
  <rect x="16" y="199" width="82" height="4" rx="2" fill="#78716c" opacity="0.6"/>
  <rect x="16" y="207" width="65" height="4" rx="2" fill="#78716c" opacity="0.5"/>
  <rect x="16" y="215" width="74" height="4" rx="2" fill="#78716c" opacity="0.4"/>

