  <rect x="0" y="39" width="400" height="60" fill="url(#heroBg)"/>
  <!-- Bottom stripe -->
  <rect x="0" y="95" width="400" height="4" fill="#fbbf24"/>
  <rect x="120" y="50" width="160" height="10" rx="4" fill="#fef3c7" opacity="0.95"/>
  <rect x="140" y="66" width="120" height="5" rx="2" fill="#fde68a" opacity="0.8"/>
  <rect x="170" y="76" width="60" height="12" rx="4" fill="#f59e0b"/>
  <rect x="178" y="79" width="44" height="6" rx="2" fill="#78350f" opacity="0.8"/>

  <!-- Body — sidebar-left + content -->
  <!-- Left Sidebar (narrow) -->
