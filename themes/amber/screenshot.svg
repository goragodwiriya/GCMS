<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#78350f"/>
      <stop offset="50%" style="stop-color:#b45309"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="panelHdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#78350f"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
  </defs>

  <!-- Page background — warm cream -->
  <rect width="400" height="300" fill="#fffbeb"/>
  <!-- Paper texture lines -->
  <line x1="0" y1="50" x2="400" y2="50" stroke="#fcd34d" stroke-width="0.5" opacity="0.4"/>
  <line x1="0" y1="100" x2="400" y2="100" stroke="#fcd34d" stroke-width="0.5" opacity="0.4"/>
  <line x1="0" y1="150" x2="400" y2="150" stroke="#fcd34d" stroke-width="0.5" opacity="0.4"/>
  <line x1="0" y1="200" x2="400" y2="200" stroke="#fcd34d" stroke-width="0.5" opacity="0.4"/>
  <line x1="0" y1="250" x2="400" y2="250" stroke="#fcd34d" stroke-width="0.5" opacity="0.4"/>

  <!-- Header -->
  <rect width="400" height="36" fill="#ffffff"/>
  <rect y="34" width="400" height="3" fill="#d97706"/>
  <!-- Logo circle -->
  <circle cx="22" cy="18" r="11" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <circle cx="22" cy="18" r="7" fill="#d97706" opacity="0.7"/>
  <rect x="40" y="12" width="65" height="5" rx="2" fill="#78350f" opacity="0.8"/>
  <rect x="40" y="21" width="45" height="3" rx="1" fill="#78716c" opacity="0.6"/>
  <!-- Nav items -->
  <rect x="200" y="13" width="30" height="9" rx="3" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <rect x="236" y="13" width="30" height="9" rx="3" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <rect x="272" y="13" width="30" height="9" rx="3" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <rect x="308" y="13" width="30" height="9" rx="3" fill="#d97706"/>
  <rect x="213" y="16" width="17" height="3" rx="1" fill="#78350f" opacity="0.7"/>
  <rect x="249" y="16" width="17" height="3" rx="1" fill="#78350f" opacity="0.7"/>
  <rect x="285" y="16" width="17" height="3" rx="1" fill="#78350f" opacity="0.7"/>
  <rect x="314" y="16" width="18" height="3" rx="1" fill="#fff" opacity="0.9"/>

