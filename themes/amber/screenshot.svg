  <rect x="8" y="233" width="100" height="54" rx="5" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
  <rect x="8" y="233" width="100" height="22" rx="5" fill="url(#panelHdr)"/>
  <rect x="8" y="245" width="100" height="10" rx="0" fill="url(#panelHdr)"/>
  <rect x="16" y="238" width="50" height="5" rx="2" fill="#fef3c7" opacity="0.95"/>
  <rect x="16" y="262" width="82" height="4" rx="2" fill="#78716c" opacity="0.5"/>
  <rect x="16" y="270" width="65" height="4" rx="2" fill="#78716c" opacity="0.4"/>
  <rect x="16" y="278" width="74" height="4" rx="2" fill="#78716c" opacity="0.3"/>

  <!-- Main Content (right) -->
  <!-- Card 1 -->
  <rect x="116" y="107" width="274" height="52" rx="5" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
  <rect x="116" y="107" width="4" height="52" rx="2" fill="#d97706"/>
  <rect x="128" y="116" width="80" height="6" rx="2" fill="#78350f" opacity="0.8"/>
  <rect x="128" y="127" width="240" height="4" rx="2" fill="#78716c" opacity="0.5"/>
  <rect x="128" y="135" width="200" height="4" rx="2" fill="#78716c" opacity="0.4"/>
  <rect x="128" y="143" width="220" height="4" rx="2" fill="#78716c" opacity="0.3"/>

  <!-- Card 2 -->
  <rect x="116" y="165" width="274" height="60" rx="5" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
  <rect x="116" y="165" width="4" height="60" rx="2" fill="#d97706"/>
  <rect x="128" y="174" width="90" height="6" rx="2" fill="#78350f" opacity="0.8"/>
  <!-- Mini cards inside -->
  <rect x="128" y="185" width="80" height="30" rx="4" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <rect x="216" y="185" width="80" height="30" rx="4" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <rect x="304" y="185" width="78" height="30" rx="4" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>

  <!-- Card 3 -->
  <rect x="116" y="231" width="274" height="56" rx="5" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
  <rect x="116" y="231" width="4" height="56" rx="2" fill="#d97706"/>
  <rect x="128" y="240" width="70" height="6" rx="2" fill="#78350f" opacity="0.8"/>
  <rect x="128" y="251" width="240" height="4" rx="2" fill="#78716c" opacity="0.5"/>
  <rect x="128" y="259" width="200" height="4" rx="2" fill="#78716c" opacity="0.4"/>
  <rect x="128" y="267" width="220" height="4" rx="2" fill="#78716c" opacity="0.3"/>
  <rect x="128" y="275" width="180" height="4" rx="2" fill="#78716c" opacity="0.2"/>

  <!-- Label -->
  <rect x="130" y="287" width="140" height="11" rx="4" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="200" y="295" font-family="system-ui,sans-serif" font-size="7" fill="#78350f" text-anchor="middle" font-weight="600">AMBER — Warm Government Theme</text>
</svg>
