  <rect x="280" y="624" width="210" height="130" fill="#d0dae8" rx="8"/>
  <rect x="504" y="624" width="210" height="130" fill="#d0dae8" rx="8"/>
  <rect x="728" y="624" width="210" height="130" fill="#d0dae8" rx="8"/>
  <rect x="952" y="624" width="228" height="130" fill="#d0dae8" rx="8"/>
  <text x="385" y="695" fill="#4a5568" font-size="11" font-family="sans-serif" text-anchor="middle">ภาพกิจกรรม 1</text>
  <text x="609" y="695" fill="#4a5568" font-size="11" font-family="sans-serif" text-anchor="middle">ภาพกิจกรรม 2</text>
  <text x="833" y="695" fill="#4a5568" font-size="11" font-family="sans-serif" text-anchor="middle">ภาพกิจกรรม 3</text>
  <text x="1066" y="695" fill="#4a5568" font-size="11" font-family="sans-serif" text-anchor="middle">ภาพกิจกรรม 4</text>

