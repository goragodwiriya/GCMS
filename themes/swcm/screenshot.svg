  <rect y="768" width="1200" height="32" fill="#001a52"/>
  <rect y="768" width="1200" height="4" fill="#c8102e"/>
  <text x="600" y="788" fill="rgba(255,255,255,0.5)" font-size="11" font-family="sans-serif" text-anchor="middle">Copyright © 2569 ชื่อโรงเรียน | GCMS Version {VERSION}</text>
