<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f4f6fb"/>

  <!-- Top utility bar -->
  <rect width="1200" height="28" fill="#001a52"/>
  <text x="20" y="18" fill="rgba(255,255,255,0.7)" font-size="11" font-family="sans-serif">ประวัติโรงเรียน  บุคลากร  ภาพกิจกรรม  ดาวน์โหลด</text>

  <!-- Header -->
  <rect y="28" width="1200" height="64" fill="#003087"/>
  <!-- Logo circle placeholder -->
  <circle cx="52" cy="60" r="22" fill="rgba(255,255,255,0.2)"/>
  <!-- Site title -->
  <text x="84" y="55" fill="#ffffff" font-size="16" font-weight="bold" font-family="sans-serif">ชื่อโรงเรียน</text>
  <text x="84" y="72" fill="rgba(255,255,255,0.75)" font-size="11" font-family="sans-serif">คำอธิบายโรงเรียน</text>
  <!-- Nav items -->
  <text x="600" y="67" fill="rgba(255,255,255,0.9)" font-size="12" font-family="sans-serif" text-anchor="middle">หน้าแรก  ข่าวสาร  บุคลากร  กิจกรรม  ผลงาน  ติดต่อ</text>

  <!-- Hero Banner -->
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003087"/>
      <stop offset="60%" stop-color="#1a4da0"/>
      <stop offset="100%" stop-color="#b00020"/>
    </linearGradient>
  </defs>
  <rect y="92" width="1200" height="180" fill="url(#heroGrad)"/>
  <rect y="268" width="1200" height="4" fill="#c8102e"/>
  <text x="600" y="175" fill="#ffffff" font-size="28" font-weight="bold" font-family="sans-serif" text-anchor="middle">ชื่อโรงเรียน</text>
  <text x="600" y="210" fill="rgba(255,255,255,0.85)" font-size="14" font-family="sans-serif" text-anchor="middle">คำอธิบายหรือวิสัยทัศน์ของโรงเรียน</text>

  <!-- Content Area (sidebar-left + main) -->
  <!-- Left Sidebar -->
  <rect x="20" y="290" width="240" height="110" fill="#ffffff" rx="8" stroke="#d0dae8" stroke-width="1"/>
  <rect x="20" y="290" width="240" height="32" fill="#003087" rx="8"/>
  <rect x="20" y="310" width="240" height="12" fill="#003087"/>
  <text x="30" y="311" fill="#ffffff" font-size="12" font-family="sans-serif">ผู้อำนวยการโรงเรียน</text>
  <circle cx="80" cy="355" r="25" fill="#e8f0fe"/>
  <text x="115" y="348" fill="#1a1a2e" font-size="11" font-family="sans-serif">นาย/นาง ชื่อ-นามสกุล</text>
  <text x="115" y="365" fill="#4a5568" font-size="10" font-family="sans-serif">ผู้อำนวยการโรงเรียน</text>

  <rect x="20" y="414" width="240" height="120" fill="#ffffff" rx="8" stroke="#d0dae8" stroke-width="1"/>
  <rect x="20" y="414" width="240" height="32" fill="#003087" rx="8"/>
  <rect x="20" y="434" width="240" height="12" fill="#003087"/>
  <text x="30" y="435" fill="#ffffff" font-size="12" font-family="sans-serif">ระบบงานออนไลน์</text>
  <text x="28" y="462" fill="#003087" font-size="11" font-family="sans-serif">● ระบบสำนักงาน</text>
  <text x="28" y="480" fill="#003087" font-size="11" font-family="sans-serif">● E-Document</text>
