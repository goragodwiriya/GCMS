  <text x="380" y="440" fill="#718096" font-size="10" font-family="sans-serif">28 ธ.ค. 2568 · ข่าวสาร</text>
  <!-- Row 3 -->
  <rect x="292" y="470" width="74" height="50" fill="#e8f0fe" rx="4"/>
  <text x="380" y="485" fill="#1a1a2e" font-size="12" font-family="sans-serif">หัวข้อข่าวประชาสัมพันธ์ข้อที่ 3</text>
  <text x="380" y="502" fill="#718096" font-size="10" font-family="sans-serif">20 ธ.ค. 2568 · ข่าวสาร</text>

  <!-- Gallery section -->
  <rect x="280" y="580" width="900" height="32" fill="#ffffff" rx="8" stroke="#d0dae8" stroke-width="1"/>
  <rect x="280" y="580" width="4" fill="#c8102e" rx="2"/>
  <text x="295" y="601" fill="#003087" font-size="13" font-weight="bold" font-family="sans-serif">ประมวลภาพกิจกรรม</text>
