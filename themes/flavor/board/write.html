<section class="board-newtopic-section">
  <div class="hero">
    <div class="container">
      <h1 class="hero-title">{TOPIC}</h1>
      <p class="hero-subtitle">{DESCRIPTION}</p>
    </div>
  </div>

  <div class="container">
    <nav class="breadcrumbs one_line">
      <ul>{BREADCRUMBS}</ul>
    </nav>

    <div class="board-newtopic-form-wrap">
      <form data-form="boardNewTopic" novalidate action="{WEBURL}api/board/topic/save" method="post" data-ajax-submit="true">
        <div class="{HAS_CATEGORY}">
          <label for="category_id">{LNG_Category}</label>
          <span class="form-control icon-tags">
            <select id="category_id" name="category_id">
              <option value="">-- {LNG_Please select} --</option>
              {CATEGORIES}
            </select>
          </span>
          <div class="comment" id="result_category_id">{LNG_Choose a category related to your content.}</div>
        </div>

        <div>
          <label for="topic">{LNG_Topic}</label>
          <span class="form-control icon-edit">
            <input type="text" id="topic" name="topic" placeholder="{LNG_Specify topic}..." minlength="3" maxlength="255" value="{TOPIC}">
          </span>
          <div class="comment" id="result_topic">{LNG_Please specify topic title (at least 3 characters).}</div>
        </div>

        <div>
          <label for="detail">{LNG_Detail}</label>
          <span class="form-control icon-file">
            <textarea id="detail" name="detail" rows="10" placeholder="{LNG_Write the content here}....">{DETAIL}</textarea>
          </span>
          <div class="comment" id="result_detail">{LNG_Please specify topic content (at least 5 characters).} {LNG_BBCode can be used.}</div>
        </div>

        <div class="board-newtopic-actions">
          <input type="hidden" name="module_id" value="{MODULE_ID}">
          <input type="hidden" name="id" value="{ID}">
          <button type="submit" class="btn btn-primary icon-send">{LNG_Post a topic}</button>
        </div>
      </form>
    </div>
  </div>
</section>
