<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="#f8fafc"/>
  <!-- Header -->
  <rect width="800" height="60" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Logo -->
  <rect x="20" y="14" width="32" height="32" rx="6" fill="url(#heroGrad)"/>
  <text x="36" y="36" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">F</text>
  <text x="64" y="36" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#0f172a">Flavor</text>
  <!-- Nav -->
  <rect x="300" y="22" width="50" height="16" rx="3" fill="#f1f5f9"/>
  <rect x="360" y="22" width="50" height="16" rx="3" fill="#f1f5f9"/>
  <rect x="420" y="22" width="50" height="16" rx="3" fill="#f1f5f9"/>
  <rect x="480" y="22" width="50" height="16" rx="3" fill="#f1f5f9"/>
  <!-- CTA nav btn -->
  <rect x="700" y="15" width="80" height="30" rx="15" fill="url(#btnGrad)"/>
  <text x="740" y="34" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#ffffff">Get Started</text>
  <!-- Hero Section with gradient -->
  <rect x="0" y="60" width="800" height="200" fill="url(#heroGrad)"/>
  <!-- Hero decorative circles -->
  <circle cx="680" cy="120" r="80" fill="rgba(255,255,255,0.08)"/>
  <circle cx="720" cy="200" r="60" fill="rgba(255,255,255,0.06)"/>
  <circle cx="100" cy="190" r="50" fill="rgba(255,255,255,0.06)"/>
  <!-- Hero text -->
  <text x="90" y="130" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Modern. Flexible.</text>
  <text x="90" y="166" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="rgba(255,255,255,0.85)">Section-based Theme</text>
  <text x="90" y="198" font-family="Arial,sans-serif" font-size="13" fill="rgba(255,255,255,0.75)">Full drag-drop support for GCMS Visual Designer</text>
  <!-- Hero buttons -->
  <rect x="90" y="212" width="110" height="36" rx="18" fill="#ffffff"/>
  <text x="145" y="236" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#6366f1">Explore Now</text>
  <rect x="214" y="212" width="110" height="36" rx="18" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
  <text x="269" y="236" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#ffffff">Learn More</text>
  <!-- Features section -->
  <rect x="0" y="260" width="800" height="140" fill="#ffffff"/>
  <!-- Feature cards -->
  <rect x="40" y="278" width="200" height="100" rx="10" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <rect x="56" y="294" width="36" height="36" rx="8" fill="#6366f1"/>
  <rect x="56" y="294" width="36" height="36" rx="8" fill="url(#heroGrad)"/>
  <rect x="100" y="298" width="110" height="10" rx="3" fill="#0f172a" opacity="0.7"/>
  <rect x="100" y="316" width="120" height="7" rx="3" fill="#e2e8f0"/>
  <rect x="100" y="330" width="90" height="7" rx="3" fill="#e2e8f0"/>
  <rect x="260" y="278" width="200" height="100" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <rect x="276" y="294" width="36" height="36" rx="8" fill="#22c55e"/>
  <rect x="320" y="298" width="100" height="10" rx="3" fill="#0f172a" opacity="0.7"/>
  <rect x="320" y="316" width="120" height="7" rx="3" fill="#e2e8f0"/>
  <rect x="320" y="330" width="80" height="7" rx="3" fill="#e2e8f0"/>
  <rect x="480" y="278" width="200" height="100" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
  <rect x="496" y="294" width="36" height="36" rx="8" fill="#f59e0b"/>
  <rect x="540" y="298" width="110" height="10" rx="3" fill="#0f172a" opacity="0.7"/>
  <rect x="540" y="316" width="100" height="7" rx="3" fill="#e2e8f0"/>
  <rect x="540" y="330" width="120" height="7" rx="3" fill="#e2e8f0"/>
  <!-- Stats bar -->
  <rect x="0" y="400" width="800" height="60" fill="#f1f5f9"/>
  <text x="133" y="436" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#6366f1">200+</text>
  <rect x="90" y="442" width="90" height="6" rx="3" fill="#e2e8f0"/>
  <text x="400" y="436" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#6366f1">∞</text>
  <rect x="358" y="442" width="90" height="6" rx="3" fill="#e2e8f0"/>
  <text x="666" y="436" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#6366f1">24/7</text>
  <rect x="624" y="442" width="90" height="6" rx="3" fill="#e2e8f0"/>
  <!-- Footer -->
  <rect x="0" y="460" width="800" height="40" fill="#0f172a"/>
  <text x="400" y="485" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">© 2026 Flavor Theme — Powered by Now.js &amp; GCMS</text>
</svg>
