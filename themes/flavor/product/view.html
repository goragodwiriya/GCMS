<!-- Product View Page -->
<div class="fv-product-view-page">
  <section class="fv-product-detail">
    <div class="container">
      <div class="product-content">
        <div class="fv-product-grid">
          <!-- Product Image Gallery -->
          <div class="fv-product-gallery">
            <div class="main-image">
              <img src="{THUMB}" alt="{TOPIC}" class="product-main-img">
              <div class="product-badges">{BADGES}</div>
              <div class="stock-status">{SHOW_STOCK}</div>
            </div>
          </div>

          <!-- Product Info -->
          <div class="fv-product-info">
            <h1 class="fv-product-title">{TOPIC}</h1>

            <div class="fv-product-meta">
              <div class="meta-item">
                <span class="meta-label" data-i18n>Product No.</span>
                <span class="meta-value">{PRODUCT_NO}</span>
              </div>
              <div class="meta-item">
                <span class="meta-label" data-i18n>ISBN</span>
                <span class="meta-value">{ISBN}</span>
              </div>
            </div>

            <div class="fv-product-pricing">
              <div class="price-box">
                <span class="price-label" data-i18n>Price</span>
                <div class="price-value">
                  <span class="current-price">{PRICE}</span>
                  <span class="currency" data-i18n>THB</span>
                </div>
              </div>
              <div class="stock-box">
                <span class="stock-label" data-i18n>Stock</span>
                <span class="stock-count">
                  <span>{STOCK}</span> <span data-i18n>items</span>
                </span>
              </div>
            </div>

            <div class="fv-product-actions">
              <div class="fv-quantity-selector">
                <label for="quantity" data-i18n>Quantity</label>
                <div class="fv-quantity-controls">
                  <button class="btn-quantity minus icon-minus" onclick="decreaseQuantity()"></button>
                  <input type="number" id="productQuantity" class="quantity-input" value="1" min="1" max="{STOCK}">
                  <button class="btn-quantity plus icon-plus" onclick="increaseQuantity()"></button>
                </div>
              </div>
              {BUTTON}
            </div>

            <div class="fv-product-details-table">
              <h3 class="fv-details-title" data-i18n>Book Details</h3>
              <table class="fv-details-table">
                <tbody>
                  <tr>
                    <td class="label" data-i18n>Publishing</td>
                    <td class="value">{PUBLISHER_NAME}</td>
                  </tr>
                  <tr>
                    <td class="label" data-i18n>Year books</td>
                    <td class="value">{COPYRIGHTYEAR}</td>
                  </tr>
                  <tr>
                    <td class="label" data-i18n>Total Pages</td>
                    <td class="value">{PAGE} <span data-i18n>pages</span></td>
                  </tr>
                  <tr>
                    <td class="label" data-i18n>Cover</td>
                    <td class="value">{COVER_NAME}</td>
                  </tr>
                  <tr>
                    <td class="label" data-i18n>Favor of work</td>
                    <td class="value">{OBJ}</td>
                  </tr>
                </tbody>
              </table>
            </div>

            <div class="fv-product-description">
              <h3 class="description-title" data-i18n>Additional Details</h3>
              <div class="description-content">{DETAIL}</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
