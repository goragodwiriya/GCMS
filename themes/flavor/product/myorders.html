<!-- My Orders Page -->
<div class="fv-my-orders-page" data-component="api" data-endpoint="{WEBURL}api/product/myorders" data-method="GET" data-url-params="true">

  <section class="page-header">
    <div class="container">
      <h1 class="page-title" data-i18n>{TOPIC}</h1>
      <p class="page-subtitle" data-i18n>{DETAIL}</p>
    </div>
  </section>

  <section class="fv-orders-section">
    <div class="container">
      <!-- Status Filter -->
      <div class="fv-orders-filter">
        <div class="fv-filter-buttons" data-for="item of order_statuses">
          <template>
            <a href="{WEBURL}product/myorders?status={{item.value}}" class="fv-filter-btn" data-class="active:status == item.value" data-text="item.text"></a>
          </template>
        </div>
      </div>

      <!-- Orders List -->
      <div class="fv-orders-list" data-for="order of orders">
        <template>
          <div class="fv-order-card">
            <div class="fv-order-header">
              <div class="order-info">
                <h3 class="fv-order-number">#<span data-text="order.order_no"></span></h3>
                <span class="order-date" data-text="order.created_at" data-format="datetime"></span>
              </div>
              <span class="fv-order-status-badge" data-text="order.order_status_text" data-attr="class:'fv-order-status-badge status-' + order.order_status"></span>
            </div>
            <div class="order-body">
              <div class="fv-order-details">
                <div class="detail-item">
                  <span class="label" data-i18n>Order Date</span>
                  <span class="value" data-text="order.created_at" data-format="date"></span>
                </div>
                <div class="detail-item">
                  <span class="label" data-i18n>Total</span>
                  <span class="value fv-order-total" data-text="order.total" data-format="currency:THB"></span>
                </div>
                <div class="detail-item">
                  <span class="label" data-i18n>Payment Method</span>
                  <span class="value" data-text="order.payment_method" data-i18n></span>
                </div>
              </div>
            </div>
            <div class="fv-order-footer">
              <a class="btn btn-primary" data-attr="href:'../product/orderdetail?id=' + order.id" data-i18n>View Details</a>
            </div>
          </div>
        </template>
      </div>

      <!-- Empty State -->
      <div class="fv-empty-state" data-if="!orders || orders.length === 0">
        <svg class="empty-icon" viewBox="0 0 24 24" width="64" height="64">
          <path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zm-7-2h2v-4h4v-2h-4V7h-2v4H8v2h4z" />
        </svg>
        <p data-i18n>You don't have any orders yet</p>
        <a href="{WEBURL}product" class="btn btn-primary" data-i18n>Start Shopping</a>
      </div>
    </div>
  </section>
</div>
