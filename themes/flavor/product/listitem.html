<article class="fv-book-card" data-book-id="{ID}">
  <a class="fv-book-card-link" href="{URL}">
    <!-- Book Image -->
    <div class="fv-book-card-image">
      <img src="{THUMB}" alt="{TOPIC}" loading="lazy" />
      <div class="product-badges">{BADGES}</div>
      <div class="stock-status">{SHOW_STOCK}</div>
    </div>

    <!-- Book Info -->
    <div class="fv-book-card-body">
      <h3 class="fv-book-title">{TOPIC}</h3>
      <div class="fv-book-meta">
        <span class="book-pages icon-file">
          {PAGE} <span data-i18n>pages</span>
        </span>
      </div>
      <div class="fv-book-footer">
        <div class="fv-book-price-wrapper">
          <span class="fv-book-price">{PRICE}</span>
          <span class="currency" data-i18n>THB</span>
        </div>
        {BUTTON}
      </div>
    </div>
  </a>
</article>
