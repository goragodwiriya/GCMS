<!-- Books List Page -->
<div class="fv-books-list-page">
  <!-- Page Header -->
  <section class="list-hero">
    <div class="container">
      <h1 class="page-title" data-i18n>List of all books</h1>
      <p class="page-subtitle" data-i18n>Find rare old books that interest you.</p>
    </div>
  </section>

  <!-- Main Content with Sidebar Layout -->
  <section class="list-content-section">
    <div class="container">
      <div class="fv-list-layout">
        <!-- Filters Sidebar -->
        <aside class="fv-filters-sidebar">
          <div class="filters-wrapper" data-component="api" data-endpoint="api/product/filter" data-method="GET" data-url-params="true" data-on-load="initProductFilters">
            <h2 class="sidebar-title" data-i18n>Filter Books</h2>

            <!-- Search Input -->
            <div class="fv-filter-group">
              <label for="searchInput" class="fv-filter-label" data-i18n>Search</label>
              <span class="form-control">
                <input type="text" class="search-input" id="searchInput" placeholder="{LNG_Type to search}" data-attr="value:search">
                <button type="button" class="icon-search" id="searchButton" aria-label="Search"></button>
              </span>
            </div>

            <!-- Categories Filter -->
            <div class="fv-filter-group">
              <label class="fv-filter-label" data-i18n>Categories</label>
              <ul class="fv-filter-categories" data-for="item of categories">
                <template>
                  <li>
                    <input type=checkbox name="category_id[]" data-attr="id:'categeory_' + item.id,value:item.id">
                    <label data-attr="for:'categeory_' + item.id" data-text="item.topic"></label>
                  </li>
                </template>
              </ul>
            </div>

            <!-- Clear Filters Button -->
            <div class="fv-filter-group">
              <button type="button" id="clearFilters" class="btn btn-secondary width100" data-i18n>Clear All Filters</button>
            </div>
          </div>
        </aside>

        <!-- Books Grid Section -->
        <div class="fv-books-grid-section">
          <div id="booksGridContainer">
            <main id="main" role="main" class="fv-books-grid">{LIST}</main>
          </div>
          <div class="fv-gallery-pagination">{PAGINATION}</div>
        </div>
      </div>
    </div>
  </section>
</div>
