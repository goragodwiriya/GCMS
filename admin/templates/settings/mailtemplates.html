<aside data-component="sidebar"></aside>
<div class="main-content">
  <div>
    <header data-component="topbar"></header>
    <main class="content">
      <div class="card-groups">
        <header>
          <div>
            <h1 class="icon-email" data-i18n>Mail templates</h1>
            <p data-i18n>Templates for e-mail sent by the system</p>
          </div>
        </header>
        <div class="content-body">
          <!-- Users Table -->
          <div class="tablebody">
            <table class="table border fullwidth" data-table="mailtemplates" data-source="../api/index/mailtemplates" data-page-size="25" data-default-sort="email_id"
                   data-show-checkbox="true" data-actions='{"delete":"Delete"}' data-action-url="../api/index/mailtemplates/action" data-action-button="Process|btn-success"
                   data-row-actions='{
                    "edit": {
                      "label": "Edit",
                      "className": "btn btn-success icon-edit"
                    }
                  }'>
              <thead>
                <tr>
                  <th data-field="name" data-i18n>{LNG_Name}</th>
                  <th data-field="code" class="center" data-cell-class="center" data-i18n>{LNG_Code}</th>
                  <th data-field="language" class="center" data-cell-class="center" data-i18n>{LNG_Language}</th>
                  <th data-field="module" class="center" data-cell-class="center" data-i18n>{LNG_Module}</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
  <footer class="footer">
    <p class="center">&copy; 2026 GCMS - Powered by <a href="https://nowjs.net">Now.js</a></p>
  </footer>
</div>
