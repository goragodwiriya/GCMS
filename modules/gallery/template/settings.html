<aside data-component="sidebar"></aside>
<div class="main-content">
  <div>
    <header data-component="topbar"></header>
    <main class="content">
      <div class="card-groups">
        <header>
          <div>
            <h1 class="icon-cog" data-i18n>{LNG_Gallery} {LNG_Settings}</h1>
            <p data-i18n>Configure gallery display and album settings</p>
          </div>
        </header>

        <div class="content-body">
          <!-- Gallery Settings Form -->
          <form data-form="gallerySettings" action="../api/gallery/settings/save" method="POST" data-ajax-submit="true" data-load-api="../api/gallery/settings/get"
                data-load-query-params="true" data-confirm="Confirm save">
            <fieldset>
              <legend class="icon-visited" data-i18n>{LNG_Display options}</legend>

              <div>
                <label for="album_view" data-i18n>Default Album View</label>
                <span class="form-control icon-menus">
                  <select id="album_view" name="album_view" data-attr="value:album_view">
                    <option value="slideshow" data-i18n>Slideshow</option>
                    <option value="grid" data-i18n>Grid (Masonry)</option>
                  </select>
                </span>
                <div class="comment" data-i18n>Default view mode when opening an album. Visitors can still switch modes manually.</div>
              </div>

              <div class="form-group">
                <div class="width50">
                  <label for="cols" data-i18n>Columns</label>
                  <span class="form-control icon-cols">
                    <select name="cols" id="cols" data-attr="value:cols">
                      <option value="1" data-i18n>1</option>
                      <option value="2" data-i18n>2</option>
                      <option value="3" data-i18n>3</option>
                      <option value="4" data-i18n>4</option>
                    </select>
                  </span>
                </div>
                <div class="width50">
                  <label for="rows" data-i18n>Rows</label>
                  <span class="form-control icon-rows">
                    <input type="number" id="rows" name="rows" data-attr="value:rows" min="1" max="12">
                  </span>
                </div>
              </div>
            </fieldset>

            <fieldset>
              <legend class="icon-shield" data-i18n>Permissions</legend>

              <div>
                <label for="can_upload" data-i18n>Can upload</label>
                <span class="form-control icon-user">
                  <select id="can_upload" name="can_upload" data-options-key="user_status" data-attr="value:can_upload" multiple></select>
                </span>
              </div>
            </fieldset>

            <!-- Submit Button -->
            <fieldset class="submit">
              <button type="submit" class="btn btn-primary icon-save" data-i18n>Save</button>
              <input type="hidden" name="module_id" data-attr="value:module_id">
            </fieldset>
          </form>
        </div>
      </div>
    </main>
  </div>
  <footer class="footer">
    <p class="center">&copy; 2026 GCMS - Powered by <a href="https://nowjs.net">Now.js</a></p>
  </footer>
</div>
