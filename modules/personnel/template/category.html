<!-- Category Form -->
<form data-form="personnelCategory" action="../api/personnel/category/save" method="post" data-ajax-submit="true" data-load-api="../api/personnel/category/get"
      data-load-query-params="true" data-confirm="Confirm save">
  <div class="card-groups">
    <header>
      <div>
        <h1 class="icon-tags" data-i18n>Department</h1>
        <p data-i18n>The category of the personnel</p>
      </div>
    </header>
    <div class="content-body">
      <fieldset class="grid">
        <div class="tablebody">
          <table class="table border fullwidth" data-table="category" data-editable-rows="true" data-attr="data:options" data-url-params="false">
            <!-- ภาษาละหนึ่งช่อง: กลุ่มคอลัมน์ languages จาก options.columnGroups -->
            <thead>
              <tr>
                <th data-field="id" data-cell-element="text" data-size="5">ID</th>
                <th data-column-group="languages" data-field="{key}" data-cell-element="text" data-size="20">{label}</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </fieldset>

      <fieldset class="submit">
        <button type="submit" class="btn btn-primary icon-save" data-i18n>Save</button>
        <input type="hidden" name="type" data-attr="value:type">
        <input type="hidden" name="module_id" data-attr="value:module_id">
      </fieldset>
    </div>
  </div>
</form>
