<div class="card-groups">
  <header>
    <div>
      <h1 class="icon-cog" data-i18n>{LNG_Personnel} {LNG_Settings}</h1>
      <p data-i18n>Configure personnel display options</p>
    </div>
  </header>

  <div class="content-body">
    <form data-form="personnelSettings" action="../api/personnel/settings/save" method="POST" data-ajax-submit="true" data-load-api="../api/personnel/settings/get"
          data-load-query-params="true" data-confirm="Confirm save">
      <fieldset>
        <legend class="icon-shield" data-i18n>Permissions</legend>

        <div>
          <label for="can_manage" data-i18n>{LNG_Can manage} {LNG_Personnel}</label>
          <span class="form-control icon-user">
            <select id="can_manage" name="can_manage" data-options-key="user_status" data-attr="value:can_manage" multiple></select>
          </span>
        </div>
      </fieldset>

      <fieldset>
        <legend class="icon-image" data-i18n>Photo</legend>

        <div class="form-group">
          <div class="width50">
            <label for="crop_aspect" data-i18n>Photo shape</label>
            <span class="form-control icon-crop">
              <select id="crop_aspect" name="crop_aspect" data-attr="value:crop_aspect">
                <option value="1" data-i18n>{LNG_Square} 1:1</option>
                <option value="3/4" data-i18n>{LNG_Portrait} 3:4</option>
                <option value="2/3" data-i18n>{LNG_Portrait} 2:3</option>
                <option value="4/3" data-i18n>{LNG_Landscape} 4:3</option>
                <option value="16/9" data-i18n>{LNG_Landscape} 16:9</option>
                <option value="" data-i18n>Do not crop</option>
              </select>
            </span>
          </div>
          <div class="width50">
            <label for="crop_width" data-i18n>Photo width</label>
            <span class="form-control icon-width">
              <input type="number" id="crop_width" name="crop_width" min="100" max="2000" step="1" data-attr="value:crop_width">
            </span>
          </div>
        </div>
        <div class="comment" data-i18n>An uploaded photo opens in a frame of this shape to be moved and zoomed, then it is saved at this width in pixels</div>
      </fieldset>

      <!-- Submit Button -->
      <fieldset class="submit">
        <button type="submit" class="btn btn-primary icon-save" data-i18n>Save</button>
        <input type="hidden" name="module_id" data-attr="value:module_id">
      </fieldset>
    </form>
  </div>
</div>
